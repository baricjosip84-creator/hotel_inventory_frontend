name: Deployment Readiness Gate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment containing the deployed URLs and smoke-account credentials
        required: true
        type: environment
      expected_backend_commit:
        description: Automation-only backend commit SHA; leave blank for a manual run
        required: false
        type: string
  workflow_run:
    workflows:
      - Frontend Validation
    types:
      - completed

permissions:
  contents: read

concurrency:
  # Keep frontend-commit and backend-commit verification runs separate. A paired
  # backend/frontend release must not cancel one side of the exact-commit proof.
  group: deployment-readiness-${{ github.event_name }}-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.expected_backend_commit || inputs.environment || github.run_id }}
  cancel-in-progress: true

jobs:
  deployment-readiness:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      READINESS_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
      DEPLOYMENT_FRONTEND_URL: ${{ vars.DEPLOYMENT_FRONTEND_URL }}
      DEPLOYMENT_BACKEND_URL: ${{ vars.DEPLOYMENT_BACKEND_URL }}
      DEPLOYMENT_REQUIRE_DECISION_INTELLIGENCE: ${{ vars.DEPLOYMENT_REQUIRE_DECISION_INTELLIGENCE || 'true' }}
      DEPLOYMENT_REQUIRE_PLATFORM_AUTH: ${{ vars.DEPLOYMENT_REQUIRE_PLATFORM_AUTH || 'false' }}
      DEPLOYMENT_REQUIRE_SENTRY_SOURCE_MAPS: ${{ vars.DEPLOYMENT_REQUIRE_SENTRY_SOURCE_MAPS || 'false' }}
      EXPECTED_FRONTEND_COMMIT: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      EXPECTED_BACKEND_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_backend_commit || '' }}
      # Optional deployment credentials from the production GitHub Environment.
      # When present, this workflow publishes the exact validated source itself
      # instead of relying on a separate Vercel Git integration to catch up.
      VERCEL_TOKEN_PRESENT: ${{ secrets.VERCEL_TOKEN != '' }}
      VERCEL_ORG_ID_PRESENT: ${{ secrets.VERCEL_ORG_ID != '' }}
      VERCEL_PROJECT_ID_PRESENT: ${{ secrets.VERCEL_PROJECT_ID != '' }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
      E2E_PLATFORM_EMAIL: ${{ secrets.E2E_PLATFORM_EMAIL }}
      E2E_PLATFORM_PASSWORD: ${{ secrets.E2E_PLATFORM_PASSWORD }}
      E2E_PLATFORM_MFA_CODE: ${{ secrets.E2E_PLATFORM_MFA_CODE }}
    steps:
      - name: Check out frontend source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Require deployment URLs and tenant smoke credentials
        shell: bash
        run: |
          test -n "$DEPLOYMENT_FRONTEND_URL" || (echo "DEPLOYMENT_FRONTEND_URL GitHub Environment variable is required" && exit 1)
          test -n "$DEPLOYMENT_BACKEND_URL" || (echo "DEPLOYMENT_BACKEND_URL GitHub Environment variable is required" && exit 1)
          test -n "$E2E_EMAIL" || (echo "E2E_EMAIL GitHub Environment secret is required" && exit 1)
          test -n "$E2E_PASSWORD" || (echo "E2E_PASSWORD GitHub Environment secret is required" && exit 1)
          if [ "$DEPLOYMENT_REQUIRE_PLATFORM_AUTH" = "true" ]; then
            test -n "$E2E_PLATFORM_EMAIL" || (echo "E2E_PLATFORM_EMAIL is required when platform auth smoke testing is enabled" && exit 1)
            test -n "$E2E_PLATFORM_PASSWORD" || (echo "E2E_PLATFORM_PASSWORD is required when platform auth smoke testing is enabled" && exit 1)
          fi

      - name: Verify optional Vercel deployment credentials
        if: ${{ github.event_name == 'workflow_run' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$VERCEL_TOKEN_PRESENT" == "true" || "$VERCEL_ORG_ID_PRESENT" == "true" || "$VERCEL_PROJECT_ID_PRESENT" == "true" ]]; then
            test "$VERCEL_TOKEN_PRESENT" = "true" && test "$VERCEL_ORG_ID_PRESENT" = "true" && test "$VERCEL_PROJECT_ID_PRESENT" = "true" || {
              echo "::error::VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID must all be set together" >&2
              exit 1
            }
          else
            echo "::notice::No explicit Vercel deployment credentials; relying on existing Vercel Git auto-deployment"
          fi

      - name: Deploy validated frontend commit to Vercel Production
        if: ${{ github.event_name == 'workflow_run' && env.VERCEL_TOKEN_PRESENT == 'true' && env.VERCEL_ORG_ID_PRESENT == 'true' && env.VERCEL_PROJECT_ID_PRESENT == 'true' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          test "$ACTUAL_SHA" = "$EXPECTED_FRONTEND_COMMIT" || {
            echo "Refusing production deployment: checked-out commit differs from expected commit" >&2
            exit 1
          }
          # Never roll back a newer main-branch deployment from an older run.
          REMOTE_MAIN="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$REMOTE_MAIN" = "$EXPECTED_FRONTEND_COMMIT" || {
            echo "Refusing to overwrite newer main ($REMOTE_MAIN) with stale run ($EXPECTED_FRONTEND_COMMIT)" >&2
            exit 1
          }
          # Vite must write the SAME commit into deployment-version.json.
          export VERCEL_GIT_COMMIT_SHA="$EXPECTED_FRONTEND_COMMIT"
          export GITHUB_SHA="$EXPECTED_FRONTEND_COMMIT"
          npx --yes vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token "$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token "$VERCEL_TOKEN"

      - name: Wait for the exact production deployment
        run: npm run wait:production-deployment

      - name: Remove legacy generated artifacts
        run: npm run repo:clean-generated

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate repository and deployment-gate contracts
        run: |
          npm run security:check
          npm run check:deployment-readiness-gate
          npm run typecheck:deployment-readiness

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run deployed frontend and backend readiness gate
        run: npm run test:deployment-readiness

      - name: Upload deployment-readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-readiness-${{ env.READINESS_ENVIRONMENT }}-${{ github.run_id }}
          path: |
            playwright-deployment-report
            test-results/deployment-readiness.json
            test-results/**/*.png
            test-results/**/*.webm
            test-results/**/*.zip
          if-no-files-found: warn
          retention-days: 30
