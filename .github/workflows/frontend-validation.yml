name: Frontend Validation

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      VERCEL: '1'
      VITE_API_BASE_URL: /api
    steps:
      - name: Check out frontend source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Remove legacy generated artifacts
        run: npm run repo:clean-generated
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify all frontend validation scripts exist in the checked-out source (FT049)
        run: npm run check:ft049-ci-entrypoints
      - name: Verify TypeScript checks resolve the project compiler (FT048)
        run: npm run check:ft048-portable-typescript
      - name: Verify hosted API build configuration cannot silently use SPA fallback
        run: |
          npm run check:production-env-governance
          npm run check:deployment-api-config-tests
      - name: Prevent original Products Cost Controls undefined translation crash (FT176)
        run: npm run check:ft176-products-status-badge-ui-scope
      - name: Prevent all Products Cost Controls unresolved identifiers (FT177)
        run: npm run check:ft177-products-identifier-scope
      - name: Verify built deployment identity uses the same source manifest (FT178)
        run: npm run check:ft178-deployment-identity
      - name: Verify original-audit business labels, evidence scores, and saved-result dates
        run: npm run check:original-audit-fe224
      - name: Verify localized Dashboard stock movement reasons (FT-015)
        run: npm run check:ft015-dashboard-reasons
      - name: Verify original CDO handoff and durable replenishment run selection
        run: npm run check:replenishment-run-selection-fe223
      - name: Verify original Workflow Composer steps respect completed source state
        run: npm run check:workflow-state-guidance-fe223
      - name: Verify compact, single-selected Intelligence Review queue
        run: npm run check:intelligence-review-compact-queue
      - name: Verify Intelligence Review URL selection and filter durability
        run: npm run check:intelligence-review-route-durability

      - name: Verify policy-effectiveness claims only from actual applied-policy evidence
        run: npm run check:policy-effectiveness-evidence

      - name: Verify policy observation rows do not claim unmeasured effectiveness (FT068)
        run: npm run check:ft068-policy-observation-row-labels

      - name: Verify original audit forecast and policy analysis feedback
        run: npm run check:forecast-policy-specific-feedback

      - name: Check tenant webhook action-specific feedback
        run: npm run check:integration-webhook-feedback
      - name: Check API key and connection registry action-specific feedback
        run: npm run check:integration-api-key-connection-feedback

      - name: Verify Customer Returns details scroll and keyboard focus
        run: npm run check:outbound-return-detail-focus

      - name: Verify action-specific Outbound mutation and receipt feedback
        run: npm run check:outbound-specific-feedback

      - name: Verify Outbound work-area refresh and browser-history navigation
        run: npm run check:outbound-tab-url-durability

      - name: Verify purchase-order direct-link focus and tenant-readable provenance
        run: npm run check:po-deep-link-and-provenance

      - name: Verify procurement decision and PO conversion feedback
        run: npm run check:procurement-decision-feedback-and-criteria

      - name: Verify procurement generated PO page spend and paging explanation
        run: npm run check:procurement-po-page-scope

      - name: Verify Advanced Inventory tab and selected-unit product URL durability
        run: npm run check:advanced-inventory-durable-route
      - name: Verify unit conversion result never reports product creation
        run: npm run check:uom-conversion-no-product-toast-fe228
      - name: UoM calculator read-only feedback safety (FE229)
        run: npm run check:uom-conversion-read-only-api-fe229

      - name: Verify production UoM calculator feedback has no developer label
        run: npm run check:uom-conversion-production-feedback-fe230

      - name: Verify Cross-Domain filter, planning run and tab history durability
        run: npm run check:cross-domain-durable-route-state

      - name: Verify task selection URL, filtered queue, and stale reads
        run: npm run check:execution-task-queue-selection

      - name: Verify Learning Feedback focus, stale responses, and cancel editing
        run: npm run check:learning-feedback-focus-and-cancel

      - name: Check historical usage display
        run: npm run check:batch198-usage-history-ui

      - name: Verify anomaly and feed refresh status
        run: npm run check:feed-anomaly-freshness

      - name: Check Operations Feed exact source navigation and reference search
        run: npm run check:operations-feed-source-link-search

      - name: Verify reservation and requisition URL selection, refresh and browser history
        run: npm run check:reservation-requisition-url-selection

      - name: Verify filtered alert counts, pinned deep links and missing quantities
        run: npm run check:alert-queue-integrity

      - name: Check supplier deep-link search and show-all navigation
        run: npm run check:supplier-deeplink-search-unlock

      - name: Check Storage Locations deep-link filters and show-all
        run: npm run check:storage-location-deeplink-search
      - name: Scanner shipment direct lookup regression
        run: npm run check:scanner-direct-shipment-lookup

      - name: Verify spreadsheet-safe CSV exports
        run: npm run check:csv-spreadsheet-formula-safety
      - name: Verify BOM stock readiness after assembly and disassembly
        run: npm run check:bom-post-execution-stock-freshness
      - name: Verify stock and BOM action-specific mutation feedback
        run: npm run check:stock-bom-action-feedback
      - name: Verify expanded spreadsheet-safe inventory exports
        run: npm run check:expanded-csv-formula-safety
      - name: Check repository hygiene and committed secrets
        run: npm run security:check
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run static commercial, security and runtime-monitoring checks
        run: |
          npm run check:products-deeplink-focus-exit
          npm run check:ft061-insights-reorder-product-reveal
          npm run check:ft062-ledger-legacy-quantity-wrap
          npm run check:ci
          npm run check:runtime-error-monitoring
      - name: Run pilot-critical TypeScript validation
        run: npm run typecheck:ci
      - name: Lint complete frontend repository
        run: npm run lint
      - name: Build production frontend
        run: npm run build
      - name: Stage a clean source distribution
        run: npm run package:stage -- --output ../frontend-source-stage

  cross-repository-contracts:
    if: ${{ vars.BACKEND_REPOSITORY != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      BACKEND_ROOT: ${{ github.workspace }}/backend
    steps:
      - name: Check out frontend source
        uses: actions/checkout@v4
        with:
          path: frontend
      - name: Check out backend source
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.BACKEND_REPOSITORY }}
          token: ${{ secrets.CROSS_REPO_READ_TOKEN }}
          path: backend
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund
      - name: Validate backend/frontend permission and AI contracts
        working-directory: frontend
        run: npm run check:cross-repo
      - name: Validate backend applied-policy evidence against frontend contract (FT049)
        working-directory: frontend
        run: npm run check:policy-effectiveness-backend
