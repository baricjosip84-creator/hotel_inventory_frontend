name: Inventory - original 9900 Playwright suite

on:
  workflow_dispatch:
    inputs:
      group:
        description: 'DISCOVER_ALL checks all 9,900 without a browser; other choices run reviewed ORIGINAL scenario IDs'
        required: true
        type: choice
        default: DISCOVER_ALL
        options:
          - DISCOVER_ALL
          - LOGIN
          - PRODUCTS
          - STOCK
          - SUPPLIERS
          - PURCHASE_ORDERS
          - STOCK_MOVEMENTS
          - SHIPMENTS
          - BULK_SAFE_01
          - BULK_SAFE_02
          - BULK_SAFE_02_RECHECK
          - BULK_SAFE_02_RECHECK_2
          - BULK_SAFE_02_RECHECK_3
          - BULK_SAFE_03
          - BULK_SAFE_03_RECHECK
          - BULK_SAFE_04
          - BULK_SAFE_04_RECHECK
          - BULK_SAFE_04_RECHECK_2
          - BULK_SAFE_05
          - BULK_SAFE_05_RECHECK
          - BULK_SAFE_05_RECHECK_2
          - BULK_SAFE_06
          - BULK_SAFE_06_RECHECK
          - BULK_SAFE_06_RECHECK_2
          - BULK_SAFE_06_RECHECK_3
          - BULK_SAFE_06_RECHECK_4
          - BULK_SAFE_07
          - BULK_SAFE_07_RECHECK
          - BULK_SAFE_07_RECHECK_2
          - BULK_SAFE_08
          - BULK_SAFE_08_RECHECK
          - BULK_SAFE_09
          - BULK_SAFE_09_RECHECK
          - BULK_SAFE_10
          - BULK_SAFE_10_RECHECK
          - BULK_SAFE_10_RECHECK_2
          - BULK_SAFE_10_RECHECK_3
          - BULK_SAFE_10_RECHECK_4
          - BULK_SAFE_10_RECHECK_5
          - BULK_SAFE_10_RECHECK_6
          - BULK_SAFE_11
          - BULK_SAFE_11_RECHECK
          - BULK_SAFE_12
          - BULK_SAFE_13
          - BULK_SAFE_14
          - BULK_SAFE_14_RECHECK
          - BULK_SAFE_15
          - BULK_SAFE_16
          - BULK_SAFE_17
      confirmation:
        description: 'Type ORIGINALTESTS to run the selected group'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: inventory-original-suite-production
  cancel-in-progress: false

jobs:
  original-suite:
    if: ${{ inputs.confirmation == 'ORIGINALTESTS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: Production
    defaults:
      run:
        working-directory: playwright-inventory
    env:
      PW_BASE_URL: 'https://hotel-inventory-frontend-mauve.vercel.app'
    steps:
      - name: Checkout frontend repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install original suite dependencies
        run: npm install --no-audit --no-fund
      - name: Update frozen historical menu assertions for the five reviewed CI-only groups
        run: node scripts/extend-b232-legacy-menu-assertions.mjs
      - name: Pin Batch 230 historical tracker without changing the cumulative tracker
        run: node scripts/pin-b230-historical-issue-tracker.mjs
      - name: Verify all scenario IDs, reviewed fingerprints, and bulk authentication isolation
        run: |
          node scripts/verify-original-suite.mjs
          node scripts/check-bulk-auth-fixture.mjs
          node scripts/check-stock-route-safety.mjs
          node scripts/check-batch-209-stock-contract.mjs
          node scripts/check-batch-210-bulk-contract.mjs
          node scripts/check-batch-211-contract.mjs
          node scripts/check-batch-212-contract.mjs
          node scripts/check-batch-213-contract.mjs
          node scripts/check-batch-214-contract.mjs
          node scripts/check-batch-215-contract.mjs
          node scripts/check-batch-216-contract.mjs
          node scripts/check-batch-217-contract.mjs
          node scripts/check-batch-218-contract.mjs
          node scripts/check-batch-219-contract.mjs
          node scripts/check-batch-220-contract.mjs
          node scripts/check-batch-221-contract.mjs
          node scripts/check-batch-222-contract.mjs
          node scripts/check-batch-223-contract.mjs
          node scripts/check-batch-224-contract.mjs
          node scripts/check-batch-225-contract.mjs
          node scripts/check-batch-226-contract.mjs
          node scripts/check-batch-227-contract.mjs
          node scripts/check-batch-228-contract.mjs
          node scripts/check-batch-228-recheck-contract.mjs
          node scripts/check-batch-229-contract.mjs
          node scripts/check-batch-229-recheck-contract.mjs
          node scripts/check-batch-229-recheck2-contract.mjs
          node scripts/check-batch-229-recheck3-contract.mjs
          node scripts/check-batch-229-recheck4-contract.mjs
          node scripts/check-batch-229-recheck5-contract.mjs
          node scripts/check-batch-229-recheck6-contract.mjs
          node scripts/check-batch-230-contract.mjs
          node scripts/check-batch-230-recheck-contract.mjs
      - name: Prepare approved Batch 231 group in this runner only
        if: ${{ inputs.group == 'BULK_SAFE_12' }}
        run: |
          node scripts/check-batch-231-contract.mjs
          node scripts/prepare-batch-231-runtime.mjs
          node scripts/check-batch-231-contract.mjs
      - name: Prepare approved Batch 232 group and protected fixture in this runner only
        if: ${{ inputs.group == 'BULK_SAFE_13' }}
        run: |
          node scripts/check-batch-232-contract.mjs
          node scripts/prepare-batch-232-runtime.mjs
          node scripts/check-batch-232-contract.mjs
          node scripts/prepare-batch-232-browser-recheck.mjs
      - name: Prepare Batch 233 (500 new original scenarios)
        if: ${{ inputs.group == 'BULK_SAFE_14' }}
        run: |
          node scripts/check-batch-233-contract.mjs
          node scripts/prepare-batch-233-runtime.mjs
      - name: Prepare Batch 233 recheck (40 corrected failed originals only)
        if: ${{ inputs.group == 'BULK_SAFE_14_RECHECK' }}
        run: |
          node scripts/check-batch-233-contract.mjs
          node scripts/check-batch-233-recheck-contract.mjs
          node scripts/prepare-batch-233-runtime.mjs
          node scripts/prepare-batch-233-recheck-runtime.mjs
      - name: Prepare Batch 234 (86 new original tenant scenarios)
        if: ${{ inputs.group == 'BULK_SAFE_15' }}
        run: |
          node scripts/check-batch-234-contract.mjs
          node scripts/prepare-batch-234-runtime.mjs
      - name: Discover all 9,900 authored original tests (no browser, no credentials)
        if: ${{ inputs.group == 'DISCOVER_ALL' }}
        env:
          PW_BASE_URL: 'http://127.0.0.1:5173'
        run: |
          npx playwright test --config=playwright.config.ts --list > original-test-discovery.txt
          tail -n 1 original-test-discovery.txt
          node -e "const s=require('fs').readFileSync('original-test-discovery.txt','utf8');const m=s.match(/Total:\s+(\d+)\s+tests?\s+in\s+(\d+)\s+files?/);if(!m||Number(m[1])!==9900||Number(m[2])!==152){console.error('Unexpected Playwright discovery totals',m?.slice(1));process.exit(1)}console.log('PASS: Playwright discovered 9,900 tests across 152 spec files')"
      - name: Prepare Batch 235 guarded tenant originals
        if: ${{ inputs.group == 'BULK_SAFE_16' || inputs.group == 'BULK_SAFE_17' }}
        run: |
          node scripts/check-batch-235-contract.mjs
          node scripts/prepare-batch-235-runtime.mjs
          node scripts/check-batch-235-recheck-auth.mjs
          node scripts/check-b235-dashboard-recovery.mjs
          node scripts/check-b235-r3-phase-plan.mjs
          node scripts/check-b235-r3-permission-fixture.mjs
          node scripts/prepare-batch-235-r4-runtime.mjs
          node scripts/check-b235-r4-target-recovery.mjs
      - name: Prepare Batch 236 R3 - unresolved tenant originals
        if: ${{ inputs.group == 'BULK_SAFE_17' }}
        run: |
          node scripts/prepare-batch-236-runtime.mjs
          node scripts/prepare-batch-236-r2-runtime.mjs
          node scripts/prepare-batch-236-r3-runtime.mjs
          node scripts/check-batch-236-fixtures.mjs
      - name: Install browser for reviewed existing tests
        if: ${{ inputs.group != 'DISCOVER_ALL' }}
        run: npx playwright install --with-deps chromium
      - name: Verify Batch 236 R3 locator and confirmation behavior without network
        if: ${{ inputs.group == 'BULK_SAFE_17' }}
        run: node scripts/check-batch-236-r3-locators.mjs
      - name: Prepare Batch 239 (16 outstanding original tenant scenarios)
        if: ${{ inputs.group == 'BULK_SAFE_17' }}
        run: |
          node scripts/prepare-batch-237-runtime.mjs
          node scripts/prepare-batch-238-runtime.mjs
          node scripts/prepare-batch-238-r2-runtime.mjs
          node scripts/prepare-batch-239-runtime.mjs
      - name: List the approved original test IDs before execution
        if: ${{ inputs.group != 'DISCOVER_ALL' }}
        env:
          PW_LIVE_ORIGINAL_READONLY: 'YES'
          PW_ORIGINAL_SUITE_GROUP: ${{ inputs.group }}
        run: |
          npx playwright test --config=playwright.live-original.config.ts --list > original-selected.txt
          tail -n 1 original-selected.txt
          node scripts/check-live-original-discovery.mjs
      - name: Batch 233 live page access preflight (inaccessible groups remain unverified)
        if: ${{ inputs.group == 'BULK_SAFE_14' }}
        env:
          PW_LIVE_ORIGINAL_READONLY: 'YES'
          PW_ORIGINAL_SUITE_GROUP: ${{ inputs.group }}
          PW_TENANT_EMAIL: ${{ secrets.E2E_EMAIL }}
          PW_TENANT_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          node scripts/preflight-batch-233-pages.mjs --init
          npx playwright test --config=playwright.b233-preflight.config.ts
          node scripts/preflight-batch-233-pages.mjs --apply
          npx playwright test --config=playwright.live-original.config.ts --list > original-selected.txt
          node scripts/check-live-original-discovery.mjs
      - name: Run reviewed ORIGINAL scenarios on live Vercel (not a new smoke suite)
        if: ${{ inputs.group != 'DISCOVER_ALL' && inputs.group != 'BULK_SAFE_15' && inputs.group != 'BULK_SAFE_16' && inputs.group != 'BULK_SAFE_17' }}
        env:
          PW_LIVE_ORIGINAL_READONLY: 'YES'
          PW_ORIGINAL_SUITE_GROUP: ${{ inputs.group }}
          PW_TENANT_EMAIL: ${{ secrets.E2E_EMAIL }}
          PW_TENANT_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          if [[ "${{ inputs.group }}" == "BULK_SAFE_12" || "${{ inputs.group }}" == "BULK_SAFE_13" || "${{ inputs.group }}" == "BULK_SAFE_14" || "${{ inputs.group }}" == "BULK_SAFE_14_RECHECK" ]]; then
            npx playwright test --config=playwright.live-original.config.ts --workers=1
          else
            npx playwright test --config=playwright.live-original.config.ts
          fi
      - name: Batch 234 guarded live page access preflight
        if: ${{ inputs.group == 'BULK_SAFE_15' }}
        env:
          PW_LIVE_ORIGINAL_READONLY: 'YES'
          PW_ORIGINAL_SUITE_GROUP: ${{ inputs.group }}
          PW_TENANT_EMAIL: ${{ secrets.E2E_EMAIL }}
          PW_TENANT_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: |
          node scripts/preflight-batch-234-pages.mjs --init
          npx playwright test --config=playwright.b234-preflight.config.ts
          node scripts/preflight-batch-234-pages.mjs --apply
          npx playwright test --config=playwright.live-original.config.ts --list > original-selected.txt
          node scripts/check-live-original-discovery.mjs
      - name: Execute only Batch 234 reviewed original IDs
        if: ${{ inputs.group == 'BULK_SAFE_15' }}
        env:
          PW_LIVE_ORIGINAL_READONLY: 'YES'
          PW_ORIGINAL_SUITE_GROUP: ${{ inputs.group }}
          PW_TENANT_EMAIL: ${{ secrets.E2E_EMAIL }}
          PW_TENANT_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: batch-234-results.json
        run: npx playwright test --config=playwright.live-original.config.ts --workers=1 --reporter=list,json
      - name: Require exact Batch 234 actual pass results (no false green)
        if: ${{ always() && inputs.group == 'BULK_SAFE_15' }}
        run: node scripts/check-batch-234-executed.mjs
      - name: Batch 235 R4 - guarded access and 9 unresolved originals
        if: ${{ inputs.group == 'BULK_SAFE_16' }}
        env:
          PW_LIVE_ORIGINAL_READONLY: 'YES'
          PW_ORIGINAL_SUITE_GROUP: ${{ inputs.group }}
          PW_TENANT_EMAIL: ${{ secrets.E2E_EMAIL }}
          PW_TENANT_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: batch-235-results.json
        run: node scripts/run-batch-235-recheck.mjs
      - name: Require exact Batch 235 actual pass results
        if: ${{ always() && inputs.group == 'BULK_SAFE_16' }}
        run: node scripts/check-batch-235-executed.mjs
      - name: Batch 239 - guarded access and 16 reviewed original tenant scenarios
        if: ${{ inputs.group == 'BULK_SAFE_17' }}
        env:
          PW_LIVE_ORIGINAL_READONLY: 'YES'
          PW_ORIGINAL_SUITE_GROUP: ${{ inputs.group }}
          PW_TENANT_EMAIL: ${{ secrets.E2E_EMAIL }}
          PW_TENANT_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          PLAYWRIGHT_JSON_OUTPUT_FILE: batch-237-results.json
        run: node scripts/run-batch-239.mjs
      - name: Require exact Batch 239 actual pass results
        if: ${{ always() && inputs.group == 'BULK_SAFE_17' }}
        run: node scripts/check-batch-239-executed.mjs
      # No auth snapshots, traces, videos, screenshots, or artifacts uploaded.
      - name: Require every Batch 233 original to have been eligible (no false green)
        if: ${{ always() && inputs.group == 'BULK_SAFE_14' }}
        run: node -e "const fs=require('node:fs');const f='./batch-233-live-access.json';if(!fs.existsSync(f)){console.error('B233 stopped before access report initialization; all 500 are unverified');process.exit(1)}const s=require(f);if(s.status!=='PROBED'||s.blocked.length){console.error('Access-unverified original IDs:',s.blocked.length);process.exit(1)}"
      # One explicitly approved bulk group or single legacy group per run; no unrestricted 9,900-test live execution.
